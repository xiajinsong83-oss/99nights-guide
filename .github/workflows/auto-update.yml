name: Auto Game Update Sync

on:
  schedule:
    # Every 12 hours (00:00 / 12:00 UTC) — 08:00 / 20:00 Beijing time.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run auto-update engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/auto_update.py

      - name: Show result
        if: always()
        run: |
          echo "Workflow finished at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git -C . log -1 --oneline 2>/dev/null || true
