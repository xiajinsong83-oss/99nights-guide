codes.schemaQ1: "How do I use the yay fishing code?"
codes.schemaA1: "Upgrade your Campfire to level 2, obtain the fishing rod, and while the rod is in the water at a fishing spot, press / to open chat and type: yay fishing (with the space). This spawns 2 Gems."
